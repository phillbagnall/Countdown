<title>No More Halves</title>
<meta name="description" content="A countdown to October 1st — the day the house becomes entirely hers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --dusk-navy: #1d2740;
    --dusk-navy-2: #34314f;
    --plum-shadow: #55415e;
    --horizon-coral: #e8916b;
    --amber-glow: #f7c579;
    --amber-bright: #ffdf9e;
    --sage: #6c8b71;
    --sage-deep: #46604c;
    --brass: #cf9f5c;
    --brass-dark: #8a6a35;
    --cream-mist: #f4e9da;
    --roof-brick: #6c3f3a;
    --wall-plaster: #ede0cd;
    --ink: #241a2b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--dusk-navy);
    color: var(--cream-mist);
    font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  a { color: inherit; }

  .page {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.75rem 1.5rem 3rem;
    position: relative;
  }

  /* ---------- Sky ---------- */
  .sky-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3.1;
    max-height: 46vh;
    border-radius: 22px;
    overflow: hidden;
    background: linear-gradient(
      180deg,
      var(--dusk-navy) 0%,
      var(--dusk-navy-2) 32%,
      var(--plum-shadow) 58%,
      var(--horizon-coral) 88%,
      var(--amber-glow) 100%
    );
    box-shadow: 0 30px 60px -25px rgba(20, 12, 30, 0.65);
  }

  .sun {
    position: absolute;
    left: 50%;
    bottom: 18%;
    width: 34%;
    aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--amber-bright) 0%, rgba(247, 197, 121, 0.55) 55%, rgba(247, 197, 121, 0) 78%);
  }

  .stars circle {
    fill: var(--cream-mist);
    animation: twinkle 3.6s ease-in-out infinite;
  }
  .stars circle:nth-child(2) { animation-delay: .6s; }
  .stars circle:nth-child(3) { animation-delay: 1.4s; }
  .stars circle:nth-child(4) { animation-delay: 2.1s; }
  .stars circle:nth-child(5) { animation-delay: 0.3s; }

  @keyframes twinkle {
    0%, 100% { opacity: .25; }
    50% { opacity: 1; }
  }

  .smoke {
    fill: none;
    stroke: rgba(244, 233, 218, 0.55);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-dasharray: 30;
    stroke-dashoffset: 0;
    animation: drift 5s linear infinite;
  }
  @keyframes drift {
    0% { stroke-dashoffset: 30; opacity: 0; }
    15% { opacity: .8; }
    85% { opacity: .5; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }

  .window-glow {
    animation: glow 4.2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { opacity: .85; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stars circle, .smoke, .window-glow { animation: none; opacity: .8; }
  }

  /* ---------- Type ---------- */
  .eyebrow {
    margin: 1.9rem 0 .4rem;
    font-family: "Karla", sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber-glow);
    text-align: center;
  }

  h1 {
    margin: 0;
    text-align: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    line-height: 1.05;
    text-wrap: balance;
    color: var(--cream-mist);
  }
  h1 em {
    font-style: italic;
    font-weight: 500;
    color: var(--amber-bright);
  }

  .tagline {
    margin: .85rem 0 0;
    text-align: center;
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.05rem, 3.6vw, 1.25rem);
    color: var(--horizon-coral);
    max-width: 26ch;
  }

  .sub {
    margin: .6rem 0 0;
    text-align: center;
    font-size: 0.95rem;
    color: rgba(244, 233, 218, 0.72);
    max-width: 32ch;
    line-height: 1.5;
  }

  /* ---------- Plaques ---------- */
  .plaques {
    margin-top: 2.3rem;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.7rem;
    width: 100%;
  }

  .plaque {
    background: linear-gradient(160deg, #dcae67 0%, var(--brass) 45%, var(--brass-dark) 100%);
    border-radius: 12px;
    padding: 0.9rem 0.3rem 0.7rem;
    text-align: center;
    box-shadow:
      0 1px 0 rgba(255, 230, 180, 0.5) inset,
      0 -2px 4px rgba(0,0,0,0.25) inset,
      0 12px 20px -12px rgba(20, 12, 10, 0.6);
    border: 1px solid rgba(60, 40, 15, 0.35);
  }

  .plaque .num {
    display: block;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 7vw, 2.1rem);
    font-variant-numeric: tabular-nums;
    color: #3a2410;
    text-shadow: 0 1px 0 rgba(255,255,255,0.25);
    line-height: 1;
  }

  .plaque .label {
    display: block;
    margin-top: .35rem;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: #4a2f14;
    opacity: 0.85;
  }

  /* ---------- Path progress ---------- */
  .path-wrap {
    width: 100%;
    margin-top: 2rem;
  }

  .path-caption {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(244, 233, 218, 0.55);
    margin-bottom: 0.5rem;
  }

  .path-track {
    position: relative;
    height: 10px;
    border-radius: 999px;
    background: rgba(244, 233, 218, 0.14);
    overflow: hidden;
  }

  .path-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--sage) 0%, var(--amber-glow) 100%);
    width: 0%;
    transition: width 0.6s ease;
  }

  /* ---------- Footer ---------- */
  .footer-note {
    margin-top: auto;
    padding-top: 2.5rem;
    text-align: center;
    font-size: 0.78rem;
    color: rgba(244, 233, 218, 0.45);
    line-height: 1.5;
  }

  .arrived h1 { font-size: clamp(2.6rem, 10vw, 3.8rem); }
</style>

<div class="page">

  <div class="sky-frame">
    <svg viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="An illustration of a small cottage at dawn, with glowing windows and a rising sun.">
      <g class="stars">
        <circle cx="40" cy="34" r="1.6"></circle>
        <circle cx="90" cy="60" r="1.2"></circle>
        <circle cx="330" cy="30" r="1.6"></circle>
        <circle cx="360" cy="70" r="1.1"></circle>
        <circle cx="60" cy="95" r="1.3"></circle>
      </g>

      <circle class="sun" cx="200" cy="0" r="0"></circle>
      <g>
        <circle cx="200" cy="235" r="70" fill="url(#sunGrad)"></circle>
      </g>
      <defs>
        <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffe6ad"></stop>
          <stop offset="55%" stop-color="#f7c579" stop-opacity="0.65"></stop>
          <stop offset="100%" stop-color="#f7c579" stop-opacity="0"></stop>
        </radialGradient>
        <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5c7a5f"></stop>
          <stop offset="100%" stop-color="#3f5843"></stop>
        </linearGradient>
      </defs>

      <!-- hill -->
      <path d="M0,255 Q100,225 200,250 T400,240 L400,300 L0,300 Z" fill="url(#hillGrad)"></path>

      <!-- hedge -->
      <circle cx="55" cy="252" r="14" fill="#4c6a4f"></circle>
      <circle cx="72" cy="256" r="17" fill="#587a5b"></circle>
      <circle cx="335" cy="254" r="15" fill="#4c6a4f"></circle>
      <circle cx="355" cy="258" r="12" fill="#587a5b"></circle>

      <!-- chimney smoke -->
      <path class="smoke" d="M262,110 Q270,98 260,88 Q252,80 262,68"></path>

      <!-- chimney -->
      <rect x="252" y="108" width="16" height="30" fill="#5a3733"></rect>
      <rect x="250" y="104" width="20" height="7" fill="#4a2c29"></rect>

      <!-- roof -->
      <polygon points="115,148 200,90 285,148" fill="#6c3f3a"></polygon>
      <polygon points="105,152 200,86 295,152 295,162 200,98 105,162" fill="#5a332f"></polygon>

      <!-- house body -->
      <rect x="128" y="148" width="144" height="98" rx="4" fill="#ede0cd"></rect>
      <rect x="128" y="148" width="144" height="98" rx="4" fill="none" stroke="#d9c8ac" stroke-width="1.5"></rect>

      <!-- rose vine -->
      <path d="M132,246 C126,220 140,205 130,182 C122,164 134,150 128,150" fill="none" stroke="#5c7a5f" stroke-width="2"></path>
      <circle cx="129" cy="220" r="3.4" fill="#e8916b"></circle>
      <circle cx="133" cy="197" r="3" fill="#f2a97e"></circle>
      <circle cx="125" cy="175" r="3.2" fill="#e8916b"></circle>
      <circle cx="131" cy="158" r="2.8" fill="#f2a97e"></circle>

      <!-- windows -->
      <g class="window-glow">
        <rect x="146" y="168" width="30" height="30" rx="2" fill="#f7c579"></rect>
        <rect x="224" y="168" width="30" height="30" rx="2" fill="#f7c579"></rect>
      </g>
      <line x1="161" y1="168" x2="161" y2="198" stroke="#8a6a35" stroke-width="2"></line>
      <line x1="146" y1="183" x2="176" y2="183" stroke="#8a6a35" stroke-width="2"></line>
      <line x1="239" y1="168" x2="239" y2="198" stroke="#8a6a35" stroke-width="2"></line>
      <line x1="224" y1="183" x2="254" y2="183" stroke="#8a6a35" stroke-width="2"></line>
      <rect x="146" y="168" width="30" height="30" rx="2" fill="none" stroke="#7a5a2c" stroke-width="1.5"></rect>
      <rect x="224" y="168" width="30" height="30" rx="2" fill="none" stroke="#7a5a2c" stroke-width="1.5"></rect>

      <!-- door -->
      <path d="M188,246 L188,214 Q188,200 200,200 Q212,200 212,214 L212,246 Z" fill="#4b6d5c"></path>
      <path d="M188,246 L188,214 Q188,200 200,200 Q212,200 212,214 L212,246 Z" fill="none" stroke="#33493d" stroke-width="1.5"></path>
      <circle cx="206" cy="230" r="1.8" fill="#e8c88a"></circle>

      <!-- door plaque -->
      <rect x="193" y="188" width="14" height="9" rx="1.5" fill="#cf9f5c" stroke="#8a6a35" stroke-width="0.75"></rect>

      <!-- path to door -->
      <ellipse cx="200" cy="252" rx="7" ry="2.6" fill="#cbb98f" opacity="0.8"></ellipse>
      <ellipse cx="200" cy="262" rx="8" ry="2.8" fill="#cbb98f" opacity="0.7"></ellipse>
      <ellipse cx="201" cy="273" rx="9" ry="3" fill="#cbb98f" opacity="0.6"></ellipse>
    </svg>
  </div>

  <p class="eyebrow" id="eyebrow">The keys are almost yours</p>
  <h1 id="headline">October <em>1st</em></h1>
  <p class="tagline">No more halves. Just home.</p>
  <p class="sub" id="subline">The day the house stops being shared, and starts being entirely yours.</p>

  <div class="plaques" id="plaques" role="timer" aria-live="polite">
    <div class="plaque"><span class="num" id="d">00</span><span class="label">Days</span></div>
    <div class="plaque"><span class="num" id="h">00</span><span class="label">Hours</span></div>
    <div class="plaque"><span class="num" id="m">00</span><span class="label">Minutes</span></div>
    <div class="plaque"><span class="num" id="s">00</span><span class="label">Seconds</span></div>
  </div>

  <div class="path-wrap">
    <div class="path-caption">
      <span>25 August</span>
      <span>1 October</span>
    </div>
    <div class="path-track"><div class="path-fill" id="progress"></div></div>
  </div>

  <p class="footer-note">This page updates itself — come back and check in on it whenever you like.</p>
</div>

<script>
  var START = new Date("2026-08-25T00:00:00+01:00");
  var TARGET = new Date("2026-10-01T00:00:00+01:00");

  var elD = document.getElementById("d");
  var elH = document.getElementById("h");
  var elM = document.getElementById("m");
  var elS = document.getElementById("s");
  var progress = document.getElementById("progress");
  var eyebrow = document.getElementById("eyebrow");
  var headline = document.getElementById("headline");
  var subline = document.getElementById("subline");
  var plaques = document.getElementById("plaques");

  function pad(n) { return String(n).padStart(2, "0"); }

  function render() {
    var now = new Date();
    var diff = TARGET - now;

    var total = TARGET - START;
    var elapsed = Math.min(Math.max(now - START, 0), total);
    progress.style.width = (elapsed / total * 100).toFixed(2) + "%";

    if (diff <= 0) {
      eyebrow.textContent = "It happened";
      headline.innerHTML = "It's <em>yours</em>";
      subline.textContent = "Every wall, every room, every bit of it. Completely hers.";
      plaques.style.display = "none";
      return;
    }

    var day = 1000 * 60 * 60 * 24;
    var days = Math.floor(diff / day);
    var hours = Math.floor((diff % day) / (1000 * 60 * 60));
    var mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    var secs = Math.floor((diff % (1000 * 60)) / 1000);

    elD.textContent = pad(days);
    elH.textContent = pad(hours);
    elM.textContent = pad(mins);
    elS.textContent = pad(secs);
  }

  render();
  setInterval(render, 1000);
</script>

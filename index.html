<title>No More Halves</title>
<meta name="description" content="A countdown to October 1st — the day the house becomes entirely hers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ground: #211d1a;
    --ground-2: #2c2521;
    --brick: #a6472e;
    --brick-deep: #7c3524;
    --slate: #5b6169;
    --slate-light: #7c828a;
    --sage: #a9b29c;
    --sage-deep: #7c8870;
    --sky-blue: #5a93c9;
    --brass: #cf9f5c;
    --brass-dark: #8a6a35;
    --cream: #efe6d8;
    --ink: #241a2b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--ground);
    color: var(--cream);
    font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  a { color: inherit; }

  .page {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.75rem 1.5rem 3rem;
    position: relative;
  }

  /* ---------- Photo ---------- */
  .photo-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3.1;
    max-height: 46vh;
    border-radius: 22px;
    overflow: hidden;
    background: var(--ground-2);
    box-shadow:
      0 0 0 1px rgba(239, 230, 216, 0.08),
      0 30px 60px -25px rgba(0, 0, 0, 0.7);
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 60% 45%;
    display: block;
  }

  .photo-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 -50px 60px -40px rgba(20, 12, 10, 0.55);
    pointer-events: none;
  }

  /* ---------- Type ---------- */
  .eyebrow {
    margin: 1.9rem 0 .4rem;
    font-family: "Karla", sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate-light);
    text-align: center;
  }

  h1 {
    margin: 0;
    text-align: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    line-height: 1.05;
    text-wrap: balance;
    color: var(--cream);
  }
  h1 em {
    font-style: italic;
    font-weight: 500;
    color: var(--brick);
  }

  .tagline {
    margin: .85rem 0 0;
    text-align: center;
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.05rem, 3.6vw, 1.25rem);
    color: var(--brick);
    max-width: 26ch;
  }

  .sub {
    margin: .6rem 0 0;
    text-align: center;
    font-size: 0.95rem;
    color: rgba(239, 230, 216, 0.68);
    max-width: 32ch;
    line-height: 1.5;
  }

  /* ---------- Plaques ---------- */
  .plaques {
    margin-top: 2.3rem;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.7rem;
    width: 100%;
  }

  .plaque {
    background: linear-gradient(160deg, #dcae67 0%, var(--brass) 45%, var(--brass-dark) 100%);
    border-radius: 12px;
    padding: 0.9rem 0.3rem 0.7rem;
    text-align: center;
    box-shadow:
      0 1px 0 rgba(255, 230, 180, 0.5) inset,
      0 -2px 4px rgba(0,0,0,0.25) inset,
      0 12px 20px -12px rgba(20, 12, 10, 0.6);
    border: 1px solid rgba(60, 40, 15, 0.35);
  }

  .plaque .num {
    display: block;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 7vw, 2.1rem);
    font-variant-numeric: tabular-nums;
    color: #3a2410;
    text-shadow: 0 1px 0 rgba(255,255,255,0.25);
    line-height: 1;
  }

  .plaque .label {
    display: block;
    margin-top: .35rem;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: #4a2f14;
    opacity: 0.85;
  }

  /* ---------- Path progress ---------- */
  .path-wrap {
    width: 100%;
    margin-top: 2rem;
  }

  .path-caption {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(239, 230, 216, 0.5);
    margin-bottom: 0.5rem;
  }

  .path-track {
    position: relative;
    height: 10px;
    border-radius: 999px;
    background: rgba(239, 230, 216, 0.13);
    overflow: hidden;
  }

  .path-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--sage) 0%, var(--brass) 100%);
    width: 0%;
    transition: width 0.6s ease;
  }

  /* ---------- Footer ---------- */
  .footer-note {
    margin-top: auto;
    padding-top: 2.5rem;
    text-align: center;
    font-size: 0.78rem;
    color: rgba(239, 230, 216, 0.4);
    line-height: 1.5;
  }
</style>

  <p class="eyebrow" id="eyebrow">The keys are almost yours</p>
  <h1 id="headline">October <em>1st</em></h1>
  <p class="tagline">No more halves. Just home.</p>
  <p class="sub" id="subline">The day the house stops being shared, and starts being entirely yours.</p>

  <div class="plaques" id="plaques" role="timer" aria-live="polite">
    <div class="plaque"><span class="num" id="d">00</span><span class="label">Days</span></div>
    <div class="plaque"><span class="num" id="h">00</span><span class="label">Hours</span></div>
    <div class="plaque"><span class="num" id="m">00</span><span class="label">Minutes</span></div>
    <div class="plaque"><span class="num" id="s">00</span><span class="label">Seconds</span></div>
  </div>

  <div class="path-wrap">
    <div class="path-caption">
      <span>25 August</span>
      <span>1 October</span>
    </div>
    <div class="path-track"><div class="path-fill" id="progress"></div></div>
  </div>

  <p class="footer-note">This page updates itself — come back and check in on it whenever you like.</p>
</div>

<script>
  var START = new Date("2026-08-25T00:00:00+01:00");
  var TARGET = new Date("2026-10-01T00:00:00+01:00");

  var elD = document.getElementById("d");
  var elH = document.getElementById("h");
  var elM = document.getElementById("m");
  var elS = document.getElementById("s");
  var progress = document.getElementById("progress");
  var eyebrow = document.getElementById("eyebrow");
  var headline = document.getElementById("headline");
  var subline = document.getElementById("subline");
  var plaques = document.getElementById("plaques");

  function pad(n) { return String(n).padStart(2, "0"); }

  function render() {
    var now = new Date();
    var diff = TARGET - now;

    var total = TARGET - START;
    var elapsed = Math.min(Math.max(now - START, 0), total);
    progress.style.width = (elapsed / total * 100).toFixed(2) + "%";

    if (diff <= 0) {
      eyebrow.textContent = "It happened";
      headline.innerHTML = "It's <em>yours</em>";
      subline.textContent = "Every wall, every room, every bit of it. Completely hers.";
      plaques.style.display = "none";
      return;
    }

    var day = 1000 * 60 * 60 * 24;
    var days = Math.floor(diff / day);
    var hours = Math.floor((diff % day) / (1000 * 60 * 60));
    var mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    var secs = Math.floor((diff % (1000 * 60)) / 1000);

    elD.textContent = pad(days);
    elH.textContent = pad(hours);
    elM.textContent = pad(mins);
    elS.textContent = pad(secs);
  }

  render();
  setInterval(render, 1000);
</script>
